<style>
    body {
        margin: 0;
        padding: 20px;
        background: hsl(275, 30%, 55%); /* 紫背景 */
        font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    /* タイトル：白文字＋紫縁取り */
    .page-title {
        font-size: 36px;
        text-align: center;
        color: white;
        text-shadow: 
            -2px -2px 0 #4b007d,
             2px -2px 0 #4b007d,
            -2px  2px 0 #4b007d,
             2px  2px 0 #4b007d;
        margin-bottom: 40px;
    }

    /* カードを2列で並べるコンテナ */
    .card-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
    }

    /* カード番号表示（カードと同じ横幅） */
    .card-number {
        width: 100%;
        background: #692e2e;
        color: white;
        font-size: 20px;
        padding: 8px 0;
        text-align: center;
        border-radius: 6px 6px 0 0;
        font-weight: bold;
    }

    /* カード本体（縦横比 1.39:1） */
    .card {
        width: 100%;
        background: rgba(255,255,255,0.3);
        border-radius: 0 0 10px 10px;
        position: relative;

        /* 縦横比を維持するための padding 技法 */
        padding-top: calc(100% * 1.39);
        overflow: hidden;
    }

    /* カード内部の配置用（絶対配置） */
    .card-inner {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
    }
</style>
</head>
