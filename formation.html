<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>本丸システム</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/menu.css">

<body>
    <header>
    <div class="mokuroku" id="mokuroku">目録</div>
    </header>
    <section class="formation">
        <div style="margin-top: 100px" />
        <div class="split-box">
        <!-- ホームベース型バッジ（漢数字はここで変更） -->
        <div class="badge badge-top">一</div>
        <div class="left-half">
            <div class="mini-split-box">
                <div class="status-left">
                    <img src="./images/character1.png" alt="？" class="character-image"> 
                </div>
                <div class="status-right">
                    <p class="status-name">歌仙兼定<br>打刀 Lv. 1<br>EXP: 0/100</p>
                </div>
            </div>
        </div>
        <div class="right-half">
        <div class="status-container">
            <div class="status-grid">
                <!-- 1行目（項目名） -->
                <div class="cell label">生存</div>
                <div class="cell label">打撃</div>
                <div class="cell label">統率</div>
                <div class="cell label">機動</div>
                <div class="cell label">衝力</div>
                <div class="cell label">範囲</div>
                <div class="cell label">必殺</div>
                <div class="cell label">偵察</div>
                <div class="cell label">隠蔽</div>
    
                <!-- 2行目（任意の値） -->
                <div class="cell value" style="--cell-color:#fff;">80</div>
                <div class="cell value" style="--cell-color:#ffe4e1;">65</div>
                <div class="cell value" style="--cell-color:#e1ffe4;">72</div>
                <div class="cell value" style="--cell-color:#e1f0ff;">90</div>
                <div class="cell value" style="--cell-color:#fff7d1;">55</div>
                <div class="cell value" style="--cell-color:#f0e1ff;">短</div>
                <div class="cell value" style="--cell-color:#ffe1f7;">88</div>
                <div class="cell value" style="--cell-color:#e1fff7;">77</div>
                <div class="cell value" style="--cell-color:#f7ffe1;">69</div>
    
            </div>
        </div>
        </div>
        </div>
    
        <div class="split-box">
        <!-- ホームベース型バッジ（漢数字はここで変更） -->
        <div class="badge badge-member">二</div>
        <div class="left-half"></div>
        <div class="right-half"></div>
        </div>
    
        <div class="split-box">
        <!-- ホームベース型バッジ（漢数字はここで変更） -->
        <div class="badge badge-member">三</div>
        <div class="left-half"></div>
        <div class="right-half"></div>
        </div>
    
        <div class="split-box">
        <!-- ホームベース型バッジ（漢数字はここで変更） -->

        <div class="left-half"></div>
        <div class="right-half"></div>
        </div>
    
        <div class="split-box">
        <!-- ホームベース型バッジ（漢数字はここで変更） -->

        <div class="left-half"></div>
        <div class="right-half"></div>
        </div>
    
        <div class="split-box">
        <!-- ホームベース型バッジ（漢数字はここで変更） -->
        <div class="badge badge-member">六</div>
        <div class="left-half"></div>
        <div class="right-half"></div>
        </div>
