    body {
        margin: 0;

        font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    /* 和紙風の質感（半透明レイヤー） */
    .washi-bg {
        background: url('https://www.transparenttextures.com/patterns/paper.png');
        background-size: cover;
        padding: 20px;
        border-radius: 10px;
    }

    /* パーツ1：タイトル */
    .title {
        font-size: 32px;
        color: white;
        margin-bottom: 30px;
        text-align: center;
        letter-spacing: 4px;
    }

    /* パーツ2：審神者情報 */
    .info-section {
        background: rgba(255,255,255,0.8);
        padding: 20px;
        border-radius: 10px;
    }

    .info-label {
        background: #6a0dad; /* 紫ラベル */
        color: white;        /* 白抜き文字 */
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 14px;
        white-space: nowrap;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    td {
        padding: 6px;
        vertical-align: middle;
        font-size: 16px;
    }

    .value {
        color: black; /* 値は黒文字 */
        padding-left: 10px;
    }

    /* 項目1（審神者名）は黒文字で単独表示 */
    .master-name {
        font-size: 18px;
        margin-bottom: 10px;
        color: black;
    }
</style>
